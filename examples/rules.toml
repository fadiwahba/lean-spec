# per-phase owner; precedence: CLI flag > this file > agent frontmatter default
[agents]
# `provider` is required only when using `lean-spec provider ...` to dispatch
# an installed headless CLI. The host may otherwise own phase dispatch.
plan      = { model = "session" }                  # interview runs in the main session
spec      = { provider = "claude", model = "opus" }
implement = { provider = "claude", model = "sonnet" }
review    = { provider = "claude", model = "opus" }
# Provider values are CLI adapter IDs: `codex`, `claude`, and `gemini`.
# Use an exact model ID accepted by the installed provider CLI. Examples:
# implement = { provider = "codex", model = "gpt-5.4", effort = "medium" } # OpenAI Codex
# review = { provider = "claude", model = "opus" }                          # Anthropic Claude
# spec = { provider = "gemini", model = "gemini-3.7-flash" }                # Google Gemini
# Codex accepts an explicit reasoning effort. Claude and Gemini have no
# documented headless effort flag in this adapter, so omit effort for them.
# `lean-spec provider run` additionally requires `auth_check = ["..."]`.
# Use a command verified for your installed provider; `provider argv` does not
# require it and safely shows the exact command before a run.
# fix inherits implement when omitted

[defaults]
tdd = true                            # v4 default ON; --no-tdd or false to opt out
constitution = ".lean-spec/CONSTITUTION.md" # injected into every agent dispatch prompt
required_verdict = "APPROVE"

[required_sections]                   # additive, as v3
"spec.md"   = ["Scope", "Acceptance Criteria", "Out of Scope", "Coder Guardrails"]
"notes.md"  = ["What was built", "How to verify"]
"review.md" = ["Verdict", "Spec Compliance", "Code Quality"]

[max_tokens]
"spec.md" = 2000
"notes.md" = 6000
"review.md" = 8000
